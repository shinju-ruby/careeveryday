<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>共學揪課報名</title>
<meta name="theme-color" content="#FF6B3D">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7E8; --card:#fff; --ink:#1D2547; --muted:#6A6F86;
  --orange:#FF6B3D; --yellow:#FFC93C; --blue:#38B6FF; --mint:#22C39A; --pink:#FF7EB6; --purple:#8B6CFF;
  --soft-orange:#FFE3D6; --soft-yellow:#FFF1C7; --soft-blue:#DDF2FF; --soft-mint:#D8F6EC; --soft-pink:#FFE2EF; --soft-purple:#ECE6FF;
  --shadow:4px 4px 0 var(--ink); --r:18px;
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:10;background:rgba(255,247,232,.94);backdrop-filter:blur(6px);border-bottom:3px solid var(--ink)}
.bar{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;cursor:pointer;flex:1;min-width:0}
.logo .em{width:40px;height:40px;flex:none;display:grid;place-items:center;font-size:23px;background:var(--yellow);border:3px solid var(--ink);border-radius:12px;box-shadow:2px 2px 0 var(--ink)}
.logo small{display:block;font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:640px;margin:0 auto;padding:18px 16px 80px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:var(--r);padding:16px;margin-bottom:18px;box-shadow:var(--shadow)}
.card h2{font-size:18px;font-weight:900;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3{font-size:16px;margin:0 0 6px}
.hero{background:var(--orange);color:#fff}
.hero h2{color:#fff;font-size:22px}
.hero p{margin:4px 0 0;font-weight:500}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;border:2px solid var(--ink);background:#fff;white-space:nowrap}
.tag.ok{background:var(--soft-mint)} .tag.wait{background:var(--soft-yellow)} .tag.off{background:#eee;color:var(--muted)}
.tag.pay{background:var(--soft-pink)} .tag.rep{background:var(--soft-blue)} .tag.mine{background:var(--yellow)}
label{display:block;font-weight:700;font-size:14px;margin:10px 0 4px}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 11px;width:100%;font-size:16px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid var(--yellow);outline-offset:1px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--orange);flex:none;margin:0}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
.btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--orange);color:#fff;padding:8px 16px;border-radius:12px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);white-space:nowrap;font-size:15px}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.blue{background:var(--blue)} .btn.mint{background:var(--mint)} .btn.white{background:#fff;color:var(--ink)} .btn.yellow{background:var(--yellow);color:var(--ink)} .btn.pink{background:var(--pink)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:10px}
.btn.big{width:100%;padding:12px;font-size:17px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.icon{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;padding:3px 6px;border-radius:8px;font-family:inherit}
.icon:hover{background:var(--soft-yellow);color:var(--ink)}
.meta{color:var(--muted);font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:4px 0}
.info{white-space:pre-wrap;font-size:14.5px;background:var(--soft-yellow);border:2px dashed var(--ink);border-radius:12px;padding:10px 12px;margin-top:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:14.5px}
.kv b{white-space:nowrap}
.course{cursor:pointer}
.course .t{font-weight:900;font-size:17px}
.sess{border:2px solid var(--ink);border-radius:14px;padding:10px 12px;margin:10px 0;background:#fff}
.sess.past{opacity:.6}
.sess .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:900}
.meter{height:10px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;margin:7px 0}
.meter i{display:block;height:100%;background:var(--mint)}
.meter.full i{background:var(--orange)}
.names{display:flex;flex-wrap:wrap;gap:5px;font-size:13.5px}
.names span{background:var(--soft-mint);border-radius:999px;padding:1px 9px;border:1.5px solid var(--ink)}
.names.w span{background:var(--soft-yellow)}
.names span.me{background:var(--yellow);font-weight:700}
.pick{display:flex;align-items:center;gap:10px;border:2px solid var(--ink);border-radius:12px;padding:9px 11px;margin:6px 0;cursor:pointer;background:#fff;font-weight:500}
.pick.on{background:var(--soft-orange)}
.pick.dis{opacity:.5;cursor:not-allowed}
.pick .hint{margin-left:auto;font-size:12.5px;font-weight:700;white-space:nowrap}
.slot{display:grid;grid-template-columns:1fr 12px 1fr 30px;gap:6px;align-items:center;margin-bottom:10px}.slot .lb{grid-column:1/4}
.kid{display:grid;grid-template-columns:1fr 84px 34px;gap:6px;margin-bottom:6px}
.list{margin:6px 0 0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1.5px dashed #c9cbd6;font-size:14.5px;flex-wrap:wrap}
.list li:last-child{border-bottom:0}
.list .no{width:24px;height:24px;flex:none;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;font-size:12px;font-weight:900;background:var(--soft-mint)}
.list .no.w{background:var(--soft-yellow)}
.list li.x{text-decoration:line-through;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:2px solid var(--ink);border-radius:999px;padding:2px 6px 2px 11px;background:var(--soft-blue);font-weight:700;font-size:14px;display:flex;align-items:center;gap:2px}
.remind{background:var(--soft-blue)}
.remind .sess{background:#fff}
.paygrp{border:2px solid var(--ink);border-radius:12px;padding:9px 11px;margin:8px 0;background:#fff}
.paygrp.done{background:var(--soft-mint)}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:700;border:2px solid var(--ink);background:#fff;padding:5px 14px;border-radius:999px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;font-weight:700;padding:10px 18px;border-radius:999px;transition:transform .25s;z-index:50;max-width:calc(100% - 32px);text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(29,37,71,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.modal.hidden{display:none}
.sheet{background:var(--bg);border:3px solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:18px 16px 28px}
.sheet h2{margin:0 0 8px;font-size:18px}
.sheet textarea{min-height:260px;font-size:14.5px}
.banner{background:var(--soft-pink);border:2px solid var(--ink);border-radius:12px;padding:8px 12px;font-size:14px;margin-bottom:14px}
.demo{background:var(--purple);color:#fff;border:2px solid var(--ink);border-radius:12px;padding:8px 12px;font-size:13.5px;margin-bottom:14px;font-weight:700}
.sep{border:0;border-top:2px dashed var(--ink);margin:14px 0;opacity:.35}
@media (min-width:560px){ .kid{grid-template-columns:1fr 120px 34px} }
</style>
</head>
<body>
<header><div class="bar">
  <div class="logo" onclick="go('')"><span class="em">🎒</span><div>共學揪課報名<small>報名・正備取・繳費・上課通知一次搞定</small></div></div>
  <button class="btn sm white" id="adminBtn" onclick="go('admin')">🔑 主揪</button>
</div></header>
<main id="app"><div class="card"><div class="empty">載入中…</div></div></main>
<div id="toast"></div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>

<script>
// ===== Firebase 設定（這些是公開識別碼，不是密碼；資料安全靠 Firestore 安全規則保護） =====
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBzlR9n_bXVeHzm4mn1NTRqsA3PSwL0oqA",
  authDomain: "careeveryday-c49fc.firebaseapp.com",
  projectId: "careeveryday-c49fc",
  storageBucket: "careeveryday-c49fc.firebasestorage.app",
  messagingSenderId: "70270100203",
  appId: "1:70270100203:web:6171f0514163cdf6d3d4ae"
};

// ===== 小工具 =====
const $ = s => document.querySelector(s);
const jsq = v => esc(JSON.stringify(String(v ?? '')));   // 安全地把值放進 onclick 屬性
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD = '日一二三四五六';
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = (off = 0) => { const d = new Date(); d.setDate(d.getDate() + off); return ymd(d); };
function fmtDate(s){ const [y,m,d] = s.split('-').map(Number); return `${m}/${d}（${WD[new Date(y,m-1,d).getDay()]}）`; }
const sessLabel = s => `${fmtDate(s.date)} ${s.start}–${s.end}${s.label ? ' ' + s.label : ''}`;
const money = n => Number(n || 0).toLocaleString('en-US');
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const store = { get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }
function openModal(html){ $('#sheet').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal(){ $('#modal').classList.add('hidden'); }
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); let ok = false; try{ ok = document.execCommand('copy'); }catch(e){} ta.remove(); return ok;
}
function showCopy(title, text){
  openModal(`<h2>${esc(title)}</h2><div class="meta">可以先改內容，再按複製貼到 LINE 群組或記事本。</div>
    <textarea id="copyBox">${esc(text)}</textarea>
    <div class="btns"><button class="btn big" onclick="doCopy()">📋 複製</button><button class="btn white" onclick="closeModal()">關閉</button></div>`);
}
async function doCopy(){ const ok = await copyText($('#copyBox').value); toast(ok ? '已複製，去 LINE 貼上吧！' : '複製失敗，請長按文字手動複製'); if(ok) closeModal(); }
const isLineApp = /Line\//i.test(navigator.userAgent);

// ===== 狀態 =====
const S = { user:null, admin:false, demo:false, ready:false, courses:[], coursesLoaded:false, signups:{}, pays:{}, err:'' };
const subs = {};

// ===== 資料層：Firebase 版 =====
function loadScript(src){ return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); }); }
const FB = {
  async init(){
    const base = 'https://www.gstatic.com/firebasejs/10.14.1/';
    await loadScript(base + 'firebase-app-compat.js');
    await Promise.all([loadScript(base + 'firebase-auth-compat.js'), loadScript(base + 'firebase-firestore-compat.js')]);
    firebase.initializeApp(FIREBASE_CONFIG);
    this.db = firebase.firestore(); this.ts = () => firebase.firestore.FieldValue.serverTimestamp();
    firebase.auth().getRedirectResult().catch(e => toast('登入失敗：' + (e.message || e.code)));
    firebase.auth().onAuthStateChanged(async u => {
      if(!u){ firebase.auth().signInAnonymously().catch(e => { S.err = (e.code === 'auth/operation-not-allowed' || e.code === 'auth/admin-restricted-operation') ? '主揪還沒在 Firebase 開啟「匿名登入」，所以暫時不能報名。' : '連線失敗：' + (e.message || e.code); render(); }); return; }
      S.user = { uid:u.uid, anon:u.isAnonymous, email:u.email, name:u.displayName };
      S.admin = false;
      if(!u.isAnonymous){ try{ await this.db.collection('cl_meta').doc('admin').get(); S.admin = true; }catch(e){ S.admin = false; } }
      resetSubs(); S.ready = true; startCourses(); render();
    });
  },
  onCourses(cb){ return this.db.collection('cl_courses').onSnapshot(q => cb(q.docs.map(d => ({ id:d.id, ...d.data() }))), e => { S.err = '讀取課程失敗：' + e.message; render(); }); },
  onSignups(cid, cb){
    return this.db.collection('cl_signups').where('courseId', '==', cid).onSnapshot(q => cb(q.docs.map(d => {
      const x = d.data({ serverTimestamps:'estimate' }); if(!/^[\w-]{1,40}$/.test(d.id)) return null; return { id:d.id, ...x, t: x.createdAt && x.createdAt.toMillis ? x.createdAt.toMillis() : Date.now() };
    }).filter(Boolean)), e => console.warn(e));
  },
  onPays(cid, cb){
    let q = this.db.collection('cl_pay').where('courseId', '==', cid);
    if(!S.admin) q = q.where('uid', '==', S.user.uid);
    return q.onSnapshot(s => cb(Object.fromEntries(s.docs.map(d => [d.id, d.data()]))), e => console.warn(e));
  },
  async addSignups(items){
    const b = this.db.batch();
    for(const it of items){
      const ref = this.db.collection('cl_signups').doc();
      const { lineId = '', ...pub } = it;
      b.set(ref, { ...pub, uid:S.user.uid, cancelled:false, createdAt:this.ts() });
      b.set(this.db.collection('cl_pay').doc(ref.id), { uid:S.user.uid, courseId:it.courseId, status:'unpaid', note:'', lineId, updatedAt:this.ts() });
    }
    await b.commit();
  },
  cancel(id, v = true){ return this.db.collection('cl_signups').doc(id).update(v ? { cancelled:true, cancelledAt:this.ts() } : { cancelled:false }); },
  setOrder(id, ms){ return this.db.collection('cl_signups').doc(id).update({ createdAt: firebase.firestore.Timestamp.fromMillis(ms) }); },
  async setPays(ids, patch, courseId){
    const b = this.db.batch();
    ids.forEach(id => b.set(this.db.collection('cl_pay').doc(id), { ...patch, courseId, updatedAt:this.ts(), ...(S.admin ? {} : { uid:S.user.uid }) }, { merge:true }));
    await b.commit();
  },
  async setCleared(ids, tag){
    for(let i = 0; i < ids.length; i += 400){ const b = this.db.batch(); ids.slice(i, i + 400).forEach(id => b.update(this.db.collection('cl_signups').doc(id), { cleared: tag || null })); await b.commit(); }
  },
  async saveCourse(id, data){ const ref = id ? this.db.collection('cl_courses').doc(id) : this.db.collection('cl_courses').doc();
    if('openAt' in data) data = { ...data, openAt: data.openAt ? firebase.firestore.Timestamp.fromMillis(data.openAt) : null };
    await ref.set({ ...data, updatedAt:this.ts() }, { merge:true }); return ref.id; },
  delCourse(id){ return this.db.collection('cl_courses').doc(id).delete(); },
  signIn(){
    const p = new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithPopup(p).catch(e => {
      if(e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') firebase.auth().signInWithRedirect(p);
      else if(e.code !== 'auth/popup-closed-by-user') toast('登入失敗：' + (e.message || e.code));
    });
  },
  signOut(){ return firebase.auth().signOut(); }
};

// ===== 資料層：試玩版（資料只存在這台裝置） =====
const DEMO = {
  key:'cl-demo-v1', ls:[],
  load(){ return store.get(this.key, null) || this.seed(); },
  save(d){ store.set(this.key, d); this.ls.forEach(f => f()); },
  seed(){
    const d = { courses:{}, signups:{}, pays:{} }, cid = 'demo1';
    const sat = []; const t = new Date(); t.setDate(t.getDate() + ((6 - t.getDay() + 7) % 7 || 7));
    for(let i = 0; i < 4; i++){ const x = new Date(t); x.setDate(t.getDate() + i * 7); sat.push(ymd(x)); }
    const sessions = []; sat.forEach((dt, i) => { sessions.push({ id:dt + '_1000', date:dt, start:'10:00', end:'11:00', label:'小班' }); if(i % 2) sessions.push({ id:dt + '_1100', date:dt, start:'11:00', end:'12:00', label:'大班' }); });
    d.courses[cid] = { title:'🎵 週六親子律動課（範例）', teacher:'小星老師', location:'陽光社區活動中心', age:'1.5～5 歲', capacity:8, feeMode:'split', teacherFee:2000, venueFee:300, fixedFee:0,
      remindNotes:'👉 活動中心 3 樓大教室\n➡️ 一樓大門進來搭電梯到 3 樓\n➡️ 記得帶水壺和小毛巾', payInfo:'範例銀行（000）帳號 0000-0000-0000，戶名 範例', payDeadline:'報名截止後 3 天內', open:true, sessions,
      notes:'⭐ 注意事項 ⭐\n滿班後會提醒繳費，期限內請完成繳費以確保名額，超時未繳納則釋出名額。\n☺︎ 找代課，請假無退費補課\n☺︎ 帶水壺補充水分，教室內請勿飲食\n☺︎ 有缺額依候補名單順序遞補', updatedAt:Date.now() };
    const fam = [['小熊媽媽','小草莓','2歲'],['兔兔爸爸','小餅乾','3.5歲'],['兔兔爸爸','小布丁','2歲'],['企鵝媽咪','小湯圓','1.5歲'],['長頸鹿媽媽','小芒果','2歲'],['貓頭鷹爸比','小饅頭','2歲'],['小象媽媽','小豆芽','2歲'],['松鼠媽媽','小麻糬','3歲'],['海豚媽媽','小蘋果','1.5歲']];
    let ms = Date.now() - 86400000 * 3;
    fam.forEach(([p, c, a]) => { const id = rid(); d.signups[id] = { courseId:cid, sessionId:sessions[0].id, parentName:p, childName:c, childAge:a, companions:1, note:'', uid:'demo-other', cancelled:false, t:ms += 60000 }; d.pays[id] = { uid:'demo-other', courseId:cid, status: Math.random() < .5 ? 'confirmed' : 'unpaid', note:'' }; });
    fam.slice(0, 5).forEach(([p, c, a]) => { const id = rid(); d.signups[id] = { courseId:cid, sessionId:sessions[1].id, parentName:p, childName:c, childAge:a, companions:1, note:'', uid:'demo-other', cancelled:false, t:ms += 60000 }; d.pays[id] = { uid:'demo-other', courseId:cid, status:'unpaid', note:'' }; });
    store.set(this.key, d); return d;
  },
  async init(){
    S.demo = true; S.user = { uid: store.get('cl-demo-role', 'parent') === 'admin' ? 'demo-admin' : 'demo-parent', anon:true };
    S.admin = S.user.uid === 'demo-admin'; S.ready = true;
    window.addEventListener('storage', e => { if(e.key === this.key) this.ls.forEach(f => f()); });
    startCourses(); render();
  },
  watch(fn){ this.ls.push(fn); fn(); return () => { this.ls = this.ls.filter(f => f !== fn); }; },
  onCourses(cb){ return this.watch(() => { const d = this.load(); cb(Object.entries(d.courses).map(([id, c]) => ({ id, ...c }))); }); },
  onSignups(cid, cb){ return this.watch(() => { const d = this.load(); cb(Object.entries(d.signups).filter(([, s]) => s.courseId === cid).map(([id, s]) => ({ id, ...s }))); }); },
  onPays(cid, cb){ return this.watch(() => { const d = this.load(); cb(Object.fromEntries(Object.entries(d.pays).filter(([, p]) => p.courseId === cid && (S.admin || p.uid === S.user.uid)))); }); },
  async addSignups(items){ const d = this.load(); let ms = Date.now(); items.forEach(it => { const id = rid(), { lineId = '', ...pub } = it; d.signups[id] = { ...pub, uid:S.user.uid, cancelled:false, t:ms++ }; d.pays[id] = { uid:S.user.uid, courseId:it.courseId, status:'unpaid', note:'', lineId }; }); this.save(d); },
  async cancel(id, v = true){ const d = this.load(); d.signups[id].cancelled = v; this.save(d); },
  async setOrder(id, ms){ const d = this.load(); d.signups[id].t = ms; this.save(d); },
  async setPays(ids, patch, courseId){ const d = this.load(); ids.forEach(id => { d.pays[id] = { ...(d.pays[id] || { uid:S.user.uid, courseId }), ...patch }; }); this.save(d); },
  async saveCourse(id, data){ const d = this.load(); id = id || rid(); d.courses[id] = { ...(d.courses[id] || {}), ...data, updatedAt:Date.now() }; this.save(d); return id; },
  async delCourse(id){ const d = this.load(); delete d.courses[id]; this.save(d); },
  async setCleared(ids, tag){ const d = this.load(); ids.forEach(id => { if(d.signups[id]) d.signups[id].cleared = tag || null; }); this.save(d); },
  signIn(){ store.set('cl-demo-role', 'admin'); location.reload(); },
  signOut(){ store.set('cl-demo-role', 'parent'); location.reload(); }
};
let API = FB;

function startCourses(){ if(subs.courses) subs.courses(); subs.courses = API.onCourses(list => { S.courses = list; S.coursesLoaded = true; ensureNeeded(); render(); }); }
function resetSubs(){ Object.keys(subs).forEach(k => { if(k !== 'courses'){ subs[k](); delete subs[k]; } }); S.signups = {}; S.pays = {}; }
function ensureCourse(cid){
  if(!subs['s:' + cid]) subs['s:' + cid] = API.onSignups(cid, list => { S.signups[cid] = list; render(); });
  if(!subs['p:' + cid]) subs['p:' + cid] = API.onPays(cid, m => { S.pays[cid] = m; render(); });
}
function ensureNeeded(){
  const r = route();
  if(r.c) ensureCourse(r.c);
  if(r.v === 'admin' && S.admin) S.courses.filter(c => upcoming(c, 3).length).forEach(c => ensureCourse(c.id));
}

// ===== 正取 / 備取 / 費用計算 =====
const getCourse = id => S.courses.find(c => c.id === id);
const openMs = c => c.openAt ? (c.openAt.toMillis ? c.openAt.toMillis() : Number(c.openAt)) : 0;
const regState = c => !c.open ? 'closed' : Date.now() < openMs(c) ? 'soon' : 'open';
function fmtTime(ms){ const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()}（${WD[d.getDay()]}）${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function stateTag(c){ const st = regState(c); return st === 'open' ? '<span class="tag ok">報名中</span>' : st === 'soon' ? `<span class="tag wait">${esc(fmtTime(openMs(c)))} 開放</span>` : '<span class="tag off">暫停報名</span>'; }
const sortedSessions = c => [...(c.sessions || [])].sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
const upcoming = (c, days) => sortedSessions(c).filter(s => s.date >= today(0) && s.date <= today(days));
const live = cid => (S.signups[cid] || []).filter(x => !x.cleared);
function roster(c, sid){
  const all = live(c.id).filter(x => x.sessionId === sid).sort((a, b) => a.t - b.t);
  const act = all.filter(x => !x.cancelled), cap = Number(c.capacity) || 8;
  return { ok:act.slice(0, cap), wait:act.slice(cap), cancelled:all.filter(x => x.cancelled), cap };
}
function perHead(c, n){
  if(c.feeMode === 'fixed') return Number(c.fixedFee) || 0;
  const cap = Number(c.capacity) || 8; n = Math.min(n || 0, cap); if(!n) return 0;
  return Math.ceil((Number(c.teacherFee) || 0) / n) + Math.ceil((Number(c.venueFee) || 0) / n);
}
function feeText(c){
  const cap = Number(c.capacity) || 8;
  if(c.feeMode === 'fixed') return `每位每堂 ${money(c.fixedFee)} 元`;
  return `老師費 ${money(c.teacherFee)}＋場地費 ${money(c.venueFee)} ／堂，由正取人數均分\n滿 ${cap} 人每位 ${money(perHead(c, cap))} 元（未滿則均分，人數越多越便宜）`;
}
const statusOf = (c, x) => { const r = roster(c, x.sessionId); const i = r.ok.indexOf(x); if(x.cancelled) return { k:'x' }; if(i >= 0) return { k:'ok', n:r.ok.length }; return { k:'wait', pos:r.wait.indexOf(x) + 1 }; };
const payOf = (c, id) => ((S.pays[c.id] || {})[id] || { status:'unpaid' });
const groupByParent = list => { const m = new Map(); list.forEach(x => { const k = (x.parentName || '').trim(); if(!m.has(k)) m.set(k, []); m.get(k).push(x); }); return m; };
const kidsText = arr => [...new Set(arr.map(x => x.childName))].join('、');

// 每位家長應繳金額（只算正取）
function billing(c){
  const res = new Map(), sess = sortedSessions(c);
  sess.forEach(s => { const r = roster(c, s.id), fee = perHead(c, r.ok.length);
    r.ok.forEach(x => { const k = (x.parentName || '').trim(); if(!res.has(k)) res.set(k, { name:k, items:[], total:0 }); const g = res.get(k); g.items.push({ x, s, fee }); g.total += fee; }); });
  res.forEach(g => { const st = g.items.map(i => payOf(c, i.x.id)); g.status = st.every(p => p.status === 'confirmed') ? 'confirmed' : st.some(p => p.status === 'reported') ? 'reported' : 'unpaid'; g.note = (st.find(p => p.note) || {}).note || ''; g.lineId = (st.find(p => p.lineId) || {}).lineId || ''; });
  return [...res.values()];
}

// ===== 要貼到 LINE 的文字 =====
const link = c => location.origin + location.pathname + '#c=' + c.id;
function txtAnnounce(c){
  const ss = sortedSessions(c), slots = new Map();
  ss.forEach(s => { const k = `${s.start}–${s.end}${s.label ? ' ' + s.label : ''}`; if(!slots.has(k)) slots.set(k, []); slots.get(k).push(fmtDate(s.date).replace(/（.）/, '')); });
  return `${c.title}\n\n` + [...slots].map(([k, d]) => `⏰ ${k}：${d.join('、')}`).join('\n') +
    `\n\n🔹 授課老師：${c.teacher || ''}\n🔹 地點：${c.location || ''}\n🔹 人數：${c.capacity || 8} 位滿班\n🔹 寶貝年齡：${c.age || ''}\n🔸 活動費用：\n${feeText(c)}\n` +

}
function openLine(c){ const ms = openMs(c); return ms ? `${fmtTime(ms)} 開放報名` + (Date.now() < ms ? '' : '（已開放）') : c.open ? '現在就可以報名' : '報名時間另行公告'; }
function txtPreview(c){

  ss.forEach(s => { const k = `${s.start}–${s.end}${s.label ? ' ' + s.label : ''}`; if(!slots.has(k)) slots.set(k, []); slots.get(k).push(fmtDate(s.date).replace(/（.）/, '')); });

    (c.payDeadline ? `\n⏳ 繳費期限：${c.payDeadline}` : '') +
    `\n\n🕙 開始報名：${openLine(c)}\n🔗 報名連結：\n${link(c)}` + (soon ? `\n（現在點進去可以先看課程內容，時間一到報名表會自動出現）` : '') +
    `\n\n✍️ 報名方式\n1. 填家長名稱（建議用 LINE 名稱）和 LINE ID\n2. 填寶貝名字、年紀（兄弟姊妹可以一起報）\n3. 勾選要上的日期 → 送出` +
    `\n\n📌 小提醒\n・依送出順序自動排正取／備取，在「我的報名」就能看到結果\n・正取臨時不能來，請在報名頁按「取消」，備取會自動遞補\n・「我的報名」會顯示應繳金額，匯款後在同一頁回報末五碼就好\n・請用同一支手機報名和查看，換手機會看不到自己的報名喔` +
    (c.notes ? `\n\n${c.notes}` : '') + `\n\n有問題再私訊主揪，謝謝大家💛`;
}
function lineNames(list, numbered){ return [...groupByParent(list)].map(([p, xs], i) => `${numbered ? (i + 1) + '. ' : ''}@${p}　${[...new Set(xs.map(x => x.childName))].join('、')}`).join('\n'); }
function txtNotice(c, date){

function txtResult(c){

// ===== 路由 =====
function route(){ const h = location.hash.replace(/^#/, ''), q = new URLSearchParams(h), ok = v => v && /^[\w-]{1,40}$/.test(v) ? v : null;
  const p = { get:k => ok(q.get(k)), has:k => q.has(k) }; if(p.get('c')) return { v:'course', c:p.get('c') }; if(p.has('edit')) return { v:'edit', id:p.get('edit') || 'new', from:p.get('from') }; if(h === 'admin') return { v:'admin' }; return { v:'home' }; }

    (S.err ? `<div class="banner">⚠️ ${esc(S.err)}</div>` : '');

  // 編輯頁只畫一次，避免打字到一半被重畫
  if(r.v === 'edit'){ const key = 'edit:' + r.id + ':' + r.from; if(lastKey === key) return; if(!S.admin){ app.innerHTML = top + loginCard(); return; } lastKey = key; app.innerHTML = top + editView(r); bindEdit(r); return; }
  if(r.v === 'course'){
    const c = getCourse(r.c); if(!c){ app.innerHTML = top + `<div class="card"><h2>找不到這堂課 🥲</h2><div class="empty">可能已被主揪刪除。</div><div class="btns"><button class="btn" onclick="go('')">回首頁</button></div></div>`; return; }
    const adminMode = S.admin && !S.parentView, key = 'course:' + c.id + ':' + adminMode;

}

function tickCountdown(){
  clearInterval(S.cdTimer);
  const f = () => { const r = route(), c = r.c && getCourse(r.c), el = $('#cd'); if(!c || !el){ clearInterval(S.cdTimer); return; }
    const left = openMs(c) - Date.now(); if(left <= 0){ clearInterval(S.cdTimer); renderForm(c); updatePicks(c); return; }
    const h = Math.floor(left / 3600000), m = Math.floor(left % 3600000 / 60000), sec = Math.floor(left % 60000 / 1000);
    el.textContent = (h ? h + ' 小時 ' : '') + pad(m) + ' 分 ' + pad(sec) + ' 秒'; };
  f(); S.cdTimer = setInterval(f, 1000);

function lastCleared(c){
  const cl = (S.signups[c.id] || []).filter(x => x.cleared); if(!cl.length) return null;

}
async function clearSignups(cid){

async function restoreSignups(cid){

    <div class="row"><div class="grow"><label>寶貝年齡</label><input id="eAge" maxlength="40" value="${val('age')}" placeholder="例如：1.5～5 歲"></div><div style="width:100px"><label>每場名額</label><input id="eCap" type="number" min="1" max="50" value="${val('capacity')}"></div></div>
    <label>收費方式</label><select id="eMode" onchange="document.getElementById('eSplit').hidden=this.value!=='split';document.getElementById('eFixed').hidden=this.value!=='fixed'">
      <option value="split" ${(base?.feeMode || 'split') === 'split' ? 'selected' : ''}>老師費＋場地費，由正取人數均分</option><option value="fixed" ${base?.feeMode === 'fixed' ? 'selected' : ''}>每人固定金額</option></select>
    <div id="eSplit" class="row" ${base?.feeMode === 'fixed' ? 'hidden' : ''}><div class="grow"><label>老師費／堂</label><input id="eTF" type="number" min="0" value="${val('teacherFee')}"></div><div class="grow"><label>場地費／堂</label><input id="eVF" type="number" min="0" value="${val('venueFee')}"></div></div>
    <div id="eFixed" ${base?.feeMode === 'fixed' ? '' : 'hidden'}><label>每人每堂</label><input id="eFF" type="number" min="0" value="${val('fixedFee')}"></div>
    <label>匯款資訊（家長在「我的報名」看得到）</label><input id="ePay" maxlength="120" value="${v('payInfo')}" placeholder="銀行代碼、帳號、戶名">
    <label>繳費期限</label><input id="eDeadline" maxlength="40" value="${v('payDeadline')}" placeholder="例如：11/1 前，或 確認正取後 3 天內">
    <label>注意事項／說明（放在開課公告裡）</label><textarea id="eNotes" maxlength="1500">${v('notes')}</textarea>
    <label>上課提醒補充說明（教室怎麼走、要帶什麼，會接在上課提醒的地點下面）</label><textarea id="eRemind" maxlength="800" placeholder="例如：&#10;👉 活動中心 3 樓大教室&#10;➡️ 一樓大門進來搭電梯到 3 樓&#10;➡️ 記得帶水壺和小毛巾">${v('remindNotes')}</textarea></div>

    <div class="card"><h2>📅 場次</h2>
    <div class="meta">先設定時段，再加日期，按「產生場次」就會把每個日期 × 每個時段排好。不要的場次可以單獨刪掉。</div>
    <label>時段</label><div id="eSlots"></div><button class="btn sm white" onclick="ED.slots.push({start:'11:00',end:'12:00',label:''});drawEd()">＋ 加時段</button>
    <label>日期</label><div class="row"><input id="eDate" type="date" class="grow"><button class="btn sm blue" onclick="addDate()">加入</button></div><div class="chips" id="eDates"></div>
    <div class="btns"><button class="btn mint" onclick="genSessions()">⬇️ 產生場次</button></div>
    <hr class="sep"><b>目前場次（<span id="eCount">0</span>）</b><ul class="list" id="eSess"></ul></div>

    <div class="card"><label class="row" style="margin:0"><input type="checkbox" id="eOpen" ${!base || copy || base.open ? 'checked' : ''}> 開放報名</label>
    <label>開放報名時間（選填，留空＝存檔後馬上可以報名）</label><div class="row"><input type="datetime-local" id="eOpenAt" class="grow" value="${base && !copy && openMs(base) ? (d => `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`)(new Date(openMs(base))) : ''}"><button class="btn sm white" onclick="$('#eOpenAt').value=''">清除</button></div>
    <div class="meta">例如設定今天 22:00，家長在那之前只會看到倒數，時間到才能送出（資料庫也會擋）。</div>
    <div class="btns"><button class="btn big" onclick="saveCourse(${jsq(r.id)})">💾 儲存課程</button></div>
    <div class="btns"><button class="btn white" onclick="history.back()">取消</button>${r.id !== 'new' ? `<button class="btn white" style="margin-left:auto;color:#c33" onclick="delCourse(${jsq(r.id)})">刪除課程</button>` : ''}</div></div>`;
}
function bindEdit(){ drawEd(); }
function drawEd(){
  $('#eSlots').innerHTML = ED.slots.map((s, i) => `<div class="slot"><input type="time" value="${s.start}" onchange="ED.slots[${i}].start=this.value"><span>–</span><input type="time" value="${s.end}" onchange="ED.slots[${i}].end=this.value"><button class="icon" onclick="ED.slots.splice(${i},1);drawEd()">✕</button><input class="lb" maxlength="10" placeholder="班別名稱（選填，例如 小班）" value="${esc(s.label)}" onchange="ED.slots[${i}].label=this.value"></div>`).join('');
  $('#eDates').innerHTML = ED.dates.sort().map((d, i) => `<span class="chip">${fmtDate(d)}<button class="icon" onclick="ED.dates.splice(${i},1);drawEd()">✕</button></span>`).join('');
  ED.sessions.sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
  $('#eSess').innerHTML = ED.sessions.map((s, i) => `<li><span class="grow">${esc(sessLabel(s))}</span><button class="icon" onclick="delSess(${i})">刪除</button></li>`).join('') || '<li class="empty">還沒有場次</li>';
  $('#eCount').textContent = ED.sessions.length;
}
function addDate(){ const d = $('#eDate').value; if(!d) return toast('先選日期'); if(!ED.dates.includes(d)) ED.dates.push(d); $('#eDate').value = ''; drawEd(); }
function genSessions(){
  if(!ED.dates.length) return toast('先加入日期'); if(!ED.slots.length) return toast('先設定時段');
  let n = 0; ED.dates.forEach(d => ED.slots.forEach(s => { if(!s.start || !s.end) return; const id = d + '_' + s.start.replace(':', ''); if(!ED.sessions.some(x => x.id === id)){ ED.sessions.push({ id, date:d, start:s.start, end:s.end, label:(s.label || '').trim() }); n++; } }));
  ED.dates = []; drawEd(); toast(`新增 ${n} 個場次`);
}
function delSess(i){
  const s = ED.sessions[i], r = route(), c = r.id !== 'new' && getCourse(r.id);
  const cnt = c ? live(c.id).filter(x => x.sessionId === s.id && !x.cancelled).length : 0;
  if(cnt && !confirm(`這場已有 ${cnt} 人報名，刪掉後他們會看不到這場，確定嗎？`)) return;
  ED.sessions.splice(i, 1); drawEd();
}
async function saveCourse(id){
  const num = (sel, d) => { const n = Number($(sel).value); return isNaN(n) ? d : n; };
  const data = { title:$('#eTitle').value.trim(), teacher:$('#eTeacher').value.trim(), location:$('#eLoc').value.trim(), age:$('#eAge').value.trim(),
    capacity:Math.max(1, num('#eCap', 8)), feeMode:$('#eMode').value, teacherFee:num('#eTF', 0), venueFee:num('#eVF', 0), fixedFee:num('#eFF', 0),
    payInfo:$('#ePay').value.trim(), payDeadline:$('#eDeadline').value.trim(), notes:$('#eNotes').value.trim(), remindNotes:$('#eRemind').value.trim(), open:$('#eOpen').checked, openAt:$('#eOpenAt').value ? new Date($('#eOpenAt').value).getTime() : null, sessions:ED.sessions };
  if(!data.title) return toast('請填課程名稱'); if(!data.sessions.length) return toast('請至少產生一個場次');
  try{ const nid = await API.saveCourse(id === 'new' ? null : id, data); toast('已儲存 🎉'); go('c=' + nid); }catch(e){ toast('儲存失敗：' + e.message); }
}
async function delCourse(id){ if(!confirm('確定刪除整個課程嗎？（報名資料會留在資料庫但看不到）')) return; try{ await API.delCourse(id); toast('已刪除'); go('admin'); }catch(e){ toast('失敗：' + e.message); } }

// ===== 啟動 =====
(async () => {
  const demo = /[?&]demo/.test(location.search) || location.protocol === 'file:';
  if(demo){ API = DEMO; return DEMO.init(); }
  try{ await FB.init(); }
  catch(e){ API = DEMO; S.err = '連不上雲端，先用試玩模式。'; DEMO.init(); }
})();
</script>
</body>
</html>
